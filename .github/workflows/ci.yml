# Checks every push and pull request: the addon's Lua files must compile with Lua 5.1 (the
# language version of the WoW client), and the offline tests must pass with an English and
# a French client.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Compile every Lua file
        run: |
          find AzerothComplete tests -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p

      - name: Run the tests with an English client
        run: AC_TEST_LOCALE=enUS lua5.1 tests/run.lua

      - name: Run the tests with a French client
        run: AC_TEST_LOCALE=frFR lua5.1 tests/run.lua
